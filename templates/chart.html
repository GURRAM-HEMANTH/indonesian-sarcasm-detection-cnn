<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <title>Chart with Bar and Pie</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-image: url();
            background-size: cover;
            font-family: 'Arial', sans-serif;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            object-fit: cover;
        }

        nav {
            background-color: transparent !important;
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        nav ul {
            list-style-type: none;
            padding: 0;
            text-align: center;
            margin: 0;
        }

        nav ul li {
            display: inline;
            margin-right: 50px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 20px;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        nav ul li a:hover {
            background-color: #ff5c75;
        }

        h3 {
            color: white;
            font-size: 30px;
            text-align: center;
            margin-top: 30px;
        }

        .chart-container {
            width: 60%;
            margin: 50px auto;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-back {
            margin: 20px;
            font-size: 18px;
            color: white;
            background-color: #ff5c75;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .btn-back:hover {
            background-color: #d49f9f;
        }

        .chart-container {
            display: flex;
            justify-content: space-evenly;
        }

        .chart-wrapper {
            width: 45%;
        }
    </style>
</head>
<body>
    <video class="video-background" autoplay muted loop>
        <source src="static/bv.mp4" type="video/mp4">
    </video>

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav" style="margin-left: 200px;">
                    <b><i><a class="nav-link active" href="/" style="font-size:30px; color:darkorange;">Home</a></i></b>
                    <b><i><a class="nav-link" href="/abstract" style="font-size:30px; color:darkorange;">About</a></i></b>
                    <b><i><a style="font-size:30px; color: darkorange;" class="nav-link active" href="/predict">Index</a></i></b>
                    <b><i> <a style="font-size:30px; color: darkorange;" class="nav-link" href="/chart">Chart</a></i></b>
                    <b><i> <a style="font-size:30px; color: darkorange;" class="nav-link" href="/">Logout</a></i></b>
                </div>
            </div>
        </div>
    </nav>

    <h3><b>Sarcasm Detection From The Text Data</b></h3>

    <div class="chart-container">
        <!-- Bar Chart -->
        <div class="chart-wrapper">
            <canvas id="myBarChart"></canvas>
        </div>

        <!-- Pie Chart -->
        <div class="chart-wrapper">
            <canvas id="myPieChart"></canvas>
        </div>
    </div>

    <script>
        // Data for the bar chart
        var barData = {
            labels: ['Sarcastic', 'No Sarcastic'],
            datasets: [{
                label: 'Sarcasm Distribution',
                data: [50, 50], // Modify this data as per your sentiment analysis
                backgroundColor: ['#36a2eb', '#ff6384'],
                borderColor: ['#36a2eb', '#ff6384'],
                borderWidth: 2
            }]
        };

        // Options for the bar chart
        var barOptions = {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 10
                    }
                }
            },
            plugins: {
                legend: {
                    position: 'top',
                },
                title: {
                    display: true,
                    text: 'Sarcasm Detection From Text'
                }
            }
        };

        // Get the canvas element for the bar chart
        var barCtx = document.getElementById('myBarChart').getContext('2d');

        // Create the bar chart
        var myBarChart = new Chart(barCtx, {
            type: 'bar',
            data: barData,
            options: barOptions
        });

        // Data for the pie chart
        var pieData = {
            labels: ['Sarcastic', 'No Sarcastic'],
            datasets: [{
                data: [50, 50], // Modify this data as per your sentiment analysis
                backgroundColor: ['#36a2eb', '#ff6384'],
                borderColor: ['#36a2eb', '#ff6384'],
                borderWidth: 2
            }]
        };

        // Options for the pie chart
        var pieOptions = {
            responsive: true,
            plugins: {
                legend: {
                    position: 'top',
                },
                title: {
                    display: true,
                    text: 'Sarcasm Distribution'
                }
            }
        };

        // Get the canvas element for the pie chart
        var pieCtx = document.getElementById('myPieChart').getContext('2d');

        // Create the pie chart
        var myPieChart = new Chart(pieCtx, {
            type: 'pie',
            data: pieData,
            options: pieOptions
        });
    </script>
</body>
</html>
