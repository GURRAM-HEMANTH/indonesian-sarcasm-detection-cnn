    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('static/bg.jpg'); /* Background image set here */
            background-size: cover;
            background-position: center;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Video background */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            object-fit: cover;
        }

        /* Transparent Navbar */
        nav {
            background-color: transparent !important;  /* Make navbar transparent */
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);  /* Optional shadow for visibility */
        }

        nav ul {
            list-style-type: none;
            padding: 0;
            text-align: center;
            margin: 0;
        }

        nav ul li {
            display: inline;
            margin-right: 300px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 20px;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        nav ul li a:hover {
            background-color: #d49f9f;
        }

        /* Center content */
        .content-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            width: 70%; /* Adjust width as needed */
            max-width: 600px; /* Limit maximum width */
            padding: 20px;
            background-color: lightslategray;  /* Semi-transparent background for text */
            border-radius: 10px;
        }

        h1 {
            font-size: 36px;
            font-weight: bold;
            line-height: 1.4;
            margin: 0;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7); 
        }
    </style>
</head>
